# Reusable: fails a pull request or a push whose commits carry an attribution line, and a pull
# request whose description does. The pattern comes from the caller's
# .githooks/attribution-pattern (its single source), or from the default below when the caller
# has none.
name: attribution

on:
  workflow_call:

permissions:
  contents: read

jobs:
  attribution:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pattern
        run: |
          if [ -f .githooks/attribution-pattern ]; then
            cp .githooks/attribution-pattern "$RUNNER_TEMP/pattern"
          else
            echo '^[[:space:]]*co-authored-by:|generated with \[?claude|claude\.com/claude-code|noreply@anthropic\.com' > "$RUNNER_TEMP/pattern"
          fi

      - name: Commits without attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          PATTERN=$(cat "$RUNNER_TEMP/pattern")
          is_zero() { printf '%s' "$1" | grep -Eq '^0+$'; }
          # A deleted branch brings no commit.
          if is_zero "$HEAD"; then exit 0; fi
          if is_zero "$BASE" || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # New branch, or force-push whose previous tip is gone: check every commit that no
            # other branch already holds.
            others=$(git for-each-ref --format='%(objectname)' refs/remotes/origin | grep -vx "$HEAD" || true)
            # shellcheck disable=SC2086 — `others` is a list of object names, one argument each.
            commits=$(git rev-list "$HEAD" --not $others)
          else
            commits=$(git rev-list "$BASE..$HEAD")
          fi
          status=0
          for c in $commits; do
            if git log -1 --format=%B "$c" | grep -Eiq "$PATTERN"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") carries a forbidden attribution line."
              status=1
            fi
          done
          exit $status

      - name: Description without attribution
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          PATTERN=$(cat "$RUNNER_TEMP/pattern")
          if printf '%s\n' "$BODY" | grep -Eiq "$PATTERN"; then
            echo "::error::The pull request description carries a forbidden attribution line."
            exit 1
          fi
